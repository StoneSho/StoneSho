name: Update profile metrics

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate activity overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          user: StoneSho
          filename: assets/metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Hong_Kong
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Generate recent activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          user: StoneSho
          filename: assets/activity.svg
          base: ""
          config_timezone: Asia/Hong_Kong
          plugin_activity: yes
          plugin_activity_limit: 6
          plugin_activity_days: 30
          plugin_activity_timestamps: yes

      - name: Generate language profile
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          user: StoneSho
          filename: assets/languages.svg
          base: ""
          config_timezone: Asia/Hong_Kong
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 6
